<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remote User</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap (If not already included in base project) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;

            /* Background */
            background: url("{% static 'bg.jpg' %}") no-repeat center center fixed;
            background-size: cover;
            position: relative;
        }

        /* Dark overlay for readability */
        body::before{
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.65);
            z-index: -1;
        }

        /* Top Title */
        .main-title{
            text-align: center;
            font-size: 22px;
            font-weight: 700;
            color: #ffffff;
            padding: 22px 12px 10px 12px;
            letter-spacing: 0.2px;
        }

        .sub-title{
            text-align: center;
            font-size: 13px;
            color: rgba(255,255,255,0.8);
            margin-bottom: 18px;
        }

        /* Navbar */
        .custom-navbar{
            background: rgba(255, 255, 255, 0.10);
            border: 1px solid rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
            border-radius: 18px;
            padding: 10px 14px;
            margin: 0 auto;
            max-width: 1100px;
        }

        .custom-navbar .nav-link{
            color: #ffffff !important;
            font-weight: 600;
            font-size: 14px;
            padding: 10px 14px !important;
            border-radius: 12px;
            transition: 0.25s ease-in-out;
        }

        .custom-navbar .nav-link:hover{
            background: rgba(255,255,255,0.15);
            transform: translateY(-1px);
        }

        .custom-navbar .nav-link.active{
            background: linear-gradient(135deg, #2563eb, #3b82f6);
            color: #fff !important;
            box-shadow: 0px 10px 22px rgba(0,0,0,0.15);
        }

        /* Logout button style */
        .logout-btn{
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.35);
        }

        .logout-btn:hover{
            background: rgba(239, 68, 68, 0.25) !important;
        }

        /* Main Content Holder */
        .mainholder{
            max-width: 1100px;
            margin: 22px auto;
            padding: 12px;
        }

        /* Responsive title */
        @media(max-width: 768px){
            .main-title{
                font-size: 18px;
            }
        }
    </style>
</head>

<body>

    <!-- Title -->
    <div class="main-title">
        Detection of Wastewater Pollution Through Natural Language Generation
    </div>
    <div class="sub-title">
        Low-Cost Sensing Platform | Remote User Dashboard
    </div>

    <!-- Navbar -->
    <div class="custom-navbar">
        <ul class="nav justify-content-center flex-wrap">

            <li class="nav-item">
                <a class="nav-link" href="{% url 'ViewYourProfile' %}">
                    👤 My Profile
                </a>
            </li>

            <li class="nav-item">
                <a class="nav-link" href="{% url 'Predict_WasteWater_Pollution_Type' %}">
                    💧 Predict Pollution
                </a>
            </li>

            <li class="nav-item">
                <a class="nav-link logout-btn" href="{% url 'login' %}">
                    🚪 Logout
                </a>
            </li>

        </ul>
    </div>

    <!-- Page Content -->
    <div class="mainholder">
        {% block userblock %}
        {% endblock %}
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
