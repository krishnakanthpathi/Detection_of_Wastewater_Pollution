{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: url("{% static 'bg.jpg' %}") no-repeat center center/cover;
            min-height: 100vh;
            display: flex;
            align-items: center;
            position: relative;
        }

        /* Dark overlay */
        body::before{
            content:"";
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.65);
            z-index: -1;
        }

        /* TOP TITLE */
        .top-title{
            position: absolute;
            top: 18px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            width: 100%;
            padding: 0 12px;
            color: white;
        }

      
        .top-title h2{
    font-weight: 900;
    font-size: 40px;   /* BIG */
    margin: 0;
    letter-spacing: 0.5px;
}

		.top-title p{
            margin: 6px 0 0;
            font-size: 28px;
            opacity: 0.9;
        }

        /* Login Card */
        .login-card {
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0px 10px 35px rgba(0,0,0,0.25);
            margin-top: 70px; /* pushes card down */
        }

        /* LEFT SIDE IMAGE */
        .left-side {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            padding: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .left-side img{
            width: 100%;
            max-height: 380px;
            object-fit: cover;
            border-radius: 16px;
            box-shadow: 0px 12px 30px rgba(0,0,0,0.25);
        }

        /* RIGHT SIDE FORM */
        .right-side {
            padding: 40px;
            background: white;
        }

        .form-control {
            height: 45px;
            border-radius: 10px;
        }

        .btn-main {
            height: 45px;
            border-radius: 10px;
            font-weight: 600;
        }

        @media(max-width:768px){
            .login-card{
                margin-top: 100px;
            }
            .top-title h2{
                font-size: 18px;
            }
            .left-side{
                padding: 18px;
            }
            .right-side{
                padding: 22px;
            }
        }
    </style>
</head>

<body>

<!-- TOP TITLE -->
<div class="top-title">
    <h2>Detection of Wastewater Pollution</h2>
    <p>Through Natural Language Generation with a Low-Cost Sensing Platform.</p>
</div>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-10 col-md-11">

            <div class="card login-card">
                <div class="row g-0">

                    <!-- LEFT SIDE IMAGE -->
                    <div class="col-md-6 left-side">
                        <img src="{% static 'water.jpg' %}" >
                    </div>

                    <!-- RIGHT SIDE FORM -->
                    <div class="col-md-6 right-side">
                        <h4 class="fw-bold mb-2">Login</h4>
                        <p class="text-muted mb-4">Enter your credentials to continue.</p>

                        <form method="POST">
                            {% csrf_token %}

                            <div class="mb-3">
                                <label class="form-label">Username</label>
                                <input type="text" name="username" class="form-control"
                                       placeholder="Enter username" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Password</label>
                                <input type="password" name="password" class="form-control"
                                       placeholder="Enter password" required>
                            </div>

                            <button type="submit" name="submit1" class="btn btn-primary w-100 btn-main">
                                Sign In
                            </button>

                            <div class="d-flex gap-2 mt-4">
                                <a href="{% url 'serviceproviderlogin' %}" class="btn btn-outline-dark w-50 btn-main">
                                    Service Provider
                                </a>

                                <a href="{% url 'Register1' %}" class="btn btn-success w-50 btn-main">
                                    Register
                                </a>
                            </div>

                        </form>
                    </div>

                </div>
            </div>

        </div>
    </div>
</div>

</body>
</html>
