{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Service Provider Login</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            margin: 0;

            background: url("{% static 'bg.jpg' %}") no-repeat center center fixed;
            background-size: cover;
            position: relative;
        }

        /* Dark overlay */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.72);
            z-index: -1;
        }

        /* Top heading */
        .main-title {
            font-size: 22px;
            font-weight: 800;
            color: #ffffff;
            text-align: center;
            margin-top: 30px;
            padding: 0 12px;
        }

        .sub-title {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.80);
            text-align: center;
            margin-top: 6px;
            margin-bottom: 25px;
            padding: 0 12px;
        }

        /* Login Card */
        .login-card {
            background: rgba(255, 255, 255, 0.92);
            border: 1px solid rgba(229, 231, 235, 0.8);
            border-radius: 18px;
            box-shadow: 0px 18px 45px rgba(0, 0, 0, 0.20);
            overflow: hidden;
        }

        /* Header */
        .login-header {
            padding: 22px 24px;
            background: linear-gradient(135deg, #2563eb, #3b82f6);
            color: white;
        }

        .login-header h4 {
            margin: 0;
            font-size: 18px;
            font-weight: 800;
        }

        .login-header p {
            margin: 6px 0 0;
            font-size: 13px;
            opacity: 0.9;
        }

        /* Body */
        .login-body {
            padding: 22px 24px;
            background: #ffffff;
        }

        /* Inputs */
        .form-label {
            font-size: 13px;
            font-weight: 600;
            color: #374151;
        }

        .form-control {
            border-radius: 12px;
            padding: 11px 12px;
            font-size: 14px;
            border: 1px solid #e5e7eb;
            box-shadow: none !important;
        }

        .form-control:focus {
            border-color: #3b82f6;
        }

        /* Login button */
        .btn-login {
            border-radius: 14px;
            padding: 12px 18px;
            font-weight: 800;
            font-size: 14px;
            border: none;
            width: 100%;
            background: linear-gradient(135deg, #2563eb, #3b82f6);
            color: white;
            transition: 0.25s ease-in-out;
        }

        .btn-login:hover {
            transform: translateY(-1px);
            box-shadow: 0px 12px 26px rgba(37, 99, 235, 0.25);
        }

        /* User login button */
        .btn-user {
            width: 100%;
            border-radius: 14px;
            padding: 11px 18px;
            font-weight: 700;
            font-size: 14px;
            border: 1px solid #e5e7eb;
            background: #f9fafb;
            transition: 0.25s ease-in-out;
        }

        .btn-user:hover {
            background: #eef2ff;
            border-color: #c7d2fe;
        }

        /* Image */
        .login-img {
            border-radius: 16px;
            max-height: 320px;
            object-fit: cover;
        }
    </style>
</head>

<body>

    <div class="container py-4">

        <!-- Top Title -->
        <div class="main-title">
            Detection of Wastewater Pollution Through Natural Language Generation
        </div>
        <div class="sub-title">
            Water pollution • Language models • Causal models • Low-cost sensors
        </div>

        <!-- Login Card -->
        <div class="row justify-content-center">
            <div class="col-lg-10 col-md-11 col-sm-12">

                <div class="login-card">

                    <!-- Header -->
                    <div class="login-header">
                        <h4>🔐 Service Provider Login</h4>
                        <p>Login to access training, charts, reports and users.</p>
                    </div>

                    <!-- Body -->
                    <div class="login-body">
                        <div class="row g-4 align-items-center">

                            <!-- LEFT IMAGE -->
                            <div class="col-lg-5 text-center">
                                <img src="{% static 'login.jpg' %}" alt="Login"
                                    class="img-fluid login-img shadow-sm">
                            </div>

                            <!-- RIGHT FORM -->
                            <div class="col-lg-7">

                                <form method="POST">
                                    {% csrf_token %}

                                    <div class="mb-3">
                                        <label class="form-label">Username</label>
                                        <input type="text" name="username" class="form-control"
                                            placeholder="Enter username" required>
                                    </div>

                                    <div class="mb-3">
                                        <label class="form-label">Password</label>
                                        <input type="password" name="password" class="form-control"
                                            placeholder="Enter password" required>
                                    </div>

                                    <div class="mt-3">
                                        <button type="submit" name="submit1" class="btn-login">
                                            ✅ Login
                                        </button>
                                    </div>

                                    <div class="mt-3">
                                        <a href="{% url 'login' %}" class="btn btn-user">
                                            👤 Go to User Login
                                        </a>
                                    </div>

                                </form>

                            </div>

                        </div>
                    </div>

                </div>

            </div>
        </div>

    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
